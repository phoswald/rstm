<?xml version="1.0" encoding="UTF-8"?>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:t="https://github.com/phoswald/rstm/rstm-template">
  <head>
    <title t:text="#title">???</title>
  </head>
  <body>
    <h1>Hello, <span t:text="name">???</span>!</h1>
    <p>The current date is <span t:text="today">???</span> (a).</p>
    <p>The current date is <t:do t:text="today">???</t:do> (b).</p>
    <p t:if="optional">Optional: <span t:text="optional">???</span>.</p>
    <p>Raw: <script t:raw="rawHtml">???</script> (a).</p>
    <p>Raw: <t:do t:raw="rawHtml">???</t:do> (b).</p>
    <!-- comment -->
    <input type="text" name="date" t:attr="value=today"/>

</html>
